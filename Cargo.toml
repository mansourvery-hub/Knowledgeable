[workspace]
resolver = "2"
members = [
  "crates/api",
  "crates/application",
  "crates/domain",
  "crates/graph",
  "crates/learner",
  "crates/tutor",
  "crates/llm",
  "crates/validation",
  "crates/infrastructure",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
authors = ["Knowledgeable Team"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/mansourvery-hub/Knowledgeable"

[workspace.dependencies]
# async / web
tokio = { version = "1.48", features = ["full"] }
axum = { version = "0.7", features = ["json", "macros"] }
tower = { version = "0.5" }
tower-http = { version = "0.6", features = ["cors", "trace", "limit", "timeout"] }
hyper = { version = "1.7" }

# serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# database
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "tls-rustls", "uuid", "chrono", "json"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.18", features = ["v4", "serde"] }

# observability / errors
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
thiserror = "2.0"
anyhow = "1.0"
dotenvy = "0.15"

# llm abstraction helpers
async-trait = "0.1"
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"], default-features = false }

# internal crates
domain = { path = "crates/domain" }
graph = { path = "crates/graph" }
learner = { path = "crates/learner" }
tutor = { path = "crates/tutor" }
llm = { path = "crates/llm" }
validation = { path = "crates/validation" }
infrastructure = { path = "crates/infrastructure" }
application = { path = "crates/application" }
api = { path = "crates/api" }
