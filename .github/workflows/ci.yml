name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  rust:
    name: Rust (fmt, check, test, clippy)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: knowledgeable
          POSTGRES_PASSWORD: knowledgeable
          POSTGRES_DB: knowledgeable
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install sqlx-cli
        run: cargo install sqlx-cli --no-default-features --features native-tls,postgres

      - name: Run DB migrations
        env:
          DATABASE_URL: postgres://knowledgeable:knowledgeable@localhost:5432/knowledgeable
        run: sqlx migrate run

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check
        run: cargo check --workspace --all-targets --all-features

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Tests
        env:
          DATABASE_URL: postgres://knowledgeable:knowledgeable@localhost:5432/knowledgeable
        run: cargo test --workspace --all-features

  flutter:
    name: Flutter (analyze, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Pub get
        working-directory: apps/client
        run: flutter pub get

      - name: Analyze
        working-directory: apps/client
        run: flutter analyze

      - name: Tests
        working-directory: apps/client
        run: flutter test

      - name: Build web (smoke)
        working-directory: apps/client
        run: flutter build web --no-pub
