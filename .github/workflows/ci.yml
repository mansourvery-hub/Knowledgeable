name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  rust:
    name: Rust (fmt, check, test, clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install sqlx-cli (sqlite)
        run: cargo install sqlx-cli --no-default-features --features sqlite

      - name: Run DB migrations (SQLite)
        env:
          DATABASE_URL: sqlite:knowledgeable.db
        run: |
          sqlx database create || true
          sqlx migrate run

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check
        run: cargo check --workspace --all-targets --all-features

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Tests
        env:
          DATABASE_URL: sqlite:knowledgeable.db
        run: cargo test --workspace --all-features

  flutter:
    name: Flutter (analyze, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Pub get
        working-directory: apps/client
        run: flutter pub get

      - name: Analyze
        working-directory: apps/client
        run: flutter analyze

      - name: Tests
        working-directory: apps/client
        run: flutter test

      - name: Build web (smoke)
        working-directory: apps/client
        run: flutter build web --no-pub
