name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  rust:
    name: Rust (fmt, check, test, clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install sqlx-cli (sqlite)
        run: cargo install sqlx-cli --no-default-features --features sqlite

      - name: Run DB migrations (SQLite)
        env:
          DATABASE_URL: sqlite:knowledgeable.db
        run: |
          sqlx database create || true
          sqlx migrate run

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check
        run: cargo check --workspace --all-targets --all-features

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Tests
        env:
          DATABASE_URL: sqlite:knowledgeable.db
        run: cargo test --workspace --all-features

  flutter:
    name: Flutter (analyze, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Pub get
        working-directory: apps/client
        run: flutter pub get

      - name: Analyze
        working-directory: apps/client
        run: flutter analyze

      - name: Tests
        working-directory: apps/client
        run: flutter test

      - name: Build web (smoke)
        working-directory: apps/client
        run: flutter build web --no-pub

  android:
    name: Android shell (web build, cap sync, assembleDebug)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            mobile/capacitor/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install API 36 packages (runner SDK + licenses)
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build web client
        working-directory: apps/web
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Sync Capacitor shell (bundled-www prod default)
        working-directory: mobile/capacitor
        run: |
          npm ci --no-audit --no-fund
          rm -rf www
          cp -r ../../apps/web/client/dist www
          npx cap sync android

      - name: Assemble debug APK
        working-directory: mobile/capacitor/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: knowledgeable-debug-apk
          path: mobile/capacitor/android/app/build/outputs/apk/debug/app-debug.apk
