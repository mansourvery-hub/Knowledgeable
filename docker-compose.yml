services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: knowledgeable
      POSTGRES_PASSWORD: knowledgeable
      POSTGRES_DB: knowledgeable
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knowledgeable -d knowledgeable"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
